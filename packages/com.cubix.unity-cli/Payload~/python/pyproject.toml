[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubix-unity-cli"
version = "0.2.10"
description = "CLI for driving Cubix Unity editor workflows."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cubix-cli = "cubix_cli.main:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
